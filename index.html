<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>FitYoga Now - Interactive Demo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--purple:#7c3aed;--purple-light:#a78bfa;--cyan:#06b6d4;--green:#10b981;--bg:#0f0c29;--card:rgba(255,255,255,0.06);--card-border:rgba(255,255,255,0.08);--text:#fff;--text-dim:rgba(255,255,255,0.6);--text-muted:rgba(255,255,255,0.4);}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif;background:#1a1a2e;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden;}
.phone{width:375px;height:812px;background:linear-gradient(170deg,var(--bg) 0%,#302b63 40%,#24243e 100%);border-radius:44px;position:relative;overflow:hidden;box-shadow:0 50px 100px rgba(0,0,0,0.5),0 0 0 2px rgba(255,255,255,0.08);}
@media(max-width:420px){body{background:var(--bg);}.phone{width:100vw;height:100vh;height:100dvh;border-radius:0;box-shadow:none;}}
.bg-deco{position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden;pointer-events:none;}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.25;}
.orb-1{width:300px;height:300px;background:var(--purple);top:-80px;right:-60px;animation:f1 8s ease-in-out infinite;}
.orb-2{width:250px;height:250px;background:var(--cyan);bottom:200px;left:-80px;animation:f2 10s ease-in-out infinite;}
.orb-3{width:200px;height:200px;background:var(--green);bottom:-40px;right:-40px;animation:f3 7s ease-in-out infinite;}
@keyframes f1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-20px,30px) scale(1.1)}}
@keyframes f2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-20px) scale(1.05)}}
@keyframes f3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-15px,-25px) scale(1.08)}}
.lang-toggle{position:absolute;top:16px;right:16px;z-index:100;display:flex;gap:4px;background:rgba(255,255,255,0.08);border-radius:20px;padding:3px;}
.lang-btn{border:none;background:none;color:var(--text-muted);font-size:11px;padding:4px 10px;border-radius:16px;cursor:pointer;transition:.3s;}
.lang-btn.active{background:var(--purple);color:#fff;}
.sbar{position:absolute;top:0;left:0;right:0;height:50px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 6px;z-index:90;pointer-events:none;}
.sbar-time{font-size:15px;font-weight:600;color:#fff;}
.sbar-icons{display:flex;align-items:center;gap:5px;}
.pages{position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden;}
.page{position:absolute;top:0;left:0;right:0;bottom:0;display:none;flex-direction:column;overflow:hidden;animation:fadeIn .3s ease;}
.page.active{display:flex;}
@keyframes fadeIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
.page-body{flex:1;overflow-y:auto;padding:50px 20px 20px;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;min-height:0;}
.page-body::-webkit-scrollbar{display:none;}
.page-body>*{flex-shrink:0;}
.progress-bar{height:3px;background:rgba(255,255,255,0.1);border-radius:2px;margin:56px 20px 0;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--purple),var(--cyan));border-radius:2px;transition:width .5s;}
.page-title{font-size:24px;font-weight:700;color:var(--text);margin-bottom:8px;}
.page-subtitle{font-size:14px;color:var(--text-dim);margin-bottom:24px;line-height:1.5;}
.page-desc{font-size:14px;color:var(--text-dim);margin-bottom:16px;line-height:1.5;}
.opt-grid{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px;}
.opt-card{background:var(--card);border:1.5px solid var(--card-border);border-radius:14px;padding:14px 16px;cursor:pointer;transition:.25s;display:flex;align-items:center;gap:10px;flex:1;min-width:calc(50% - 10px);}
.opt-card.wide{min-width:100%;}
.opt-card.selected{border-color:var(--purple);background:rgba(124,58,237,0.15);box-shadow:0 0 20px rgba(124,58,237,0.15);}
.opt-card .opt-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;color:#fff;}
.opt-card .opt-text{flex:1;}
.opt-card .opt-title{font-size:14px;font-weight:600;color:var(--text);}
.opt-card .opt-desc{font-size:11px;color:var(--text-dim);margin-top:2px;}
.btn-primary{width:100%;padding:16px;border:none;border-radius:14px;font-size:16px;font-weight:600;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--purple),#9333ea);box-shadow:0 8px 24px rgba(124,58,237,0.4);transition:.3s;position:relative;overflow:hidden;}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 12px 32px rgba(124,58,237,0.5);}
.btn-secondary{width:100%;padding:14px;border:1.5px solid var(--card-border);border-radius:14px;font-size:14px;font-weight:500;cursor:pointer;color:var(--text);background:var(--card);transition:.3s;margin-top:10px;}
.btn-secondary:hover{border-color:var(--purple-light);}
.btn-row{display:flex;gap:10px;margin-top:16px;}
.btn-row .btn-primary,.btn-row .btn-secondary{flex:1;}
.trust-card{background:var(--card);border:1px solid var(--card-border);border-radius:16px;padding:20px;margin-bottom:16px;backdrop-filter:blur(10px);}
.stat-row{display:flex;justify-content:space-around;margin:20px 0;text-align:center;}
.stat-item .stat-num{font-size:28px;font-weight:700;background:linear-gradient(135deg,var(--purple-light),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.stat-item .stat-label{font-size:12px;color:var(--text-dim);margin-top:4px;}
.info-row{display:flex;gap:10px;margin:16px 0;}
.info-item{flex:1;background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:14px 12px;text-align:center;}
.info-item .info-icon{font-size:24px;margin-bottom:6px;}
.info-item .info-title{font-size:13px;font-weight:600;color:var(--text);}
.info-item .info-desc{font-size:11px;color:var(--text-dim);margin-top:4px;line-height:1.4;}
.review-card{background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:16px;margin-top:16px;font-style:italic;color:var(--text-dim);font-size:13px;line-height:1.6;}
.review-card .reviewer{font-style:normal;color:var(--text-muted);font-size:12px;margin-top:8px;text-align:right;}
.sub-cards{display:flex;flex-direction:column;gap:10px;margin:16px 0;}
.sub-card{display:flex;align-items:center;padding:14px;background:var(--card);border:1.5px solid var(--card-border);border-radius:14px;cursor:pointer;transition:.25s;position:relative;}
.sub-card.selected{border-color:var(--purple);background:rgba(124,58,237,0.12);}
.sub-card .sub-radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--text-muted);margin-right:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:.25s;}
.sub-card.selected .sub-radio{border-color:var(--purple);}
.sub-card.selected .sub-radio::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--purple);}
.sub-card .sub-info{flex:1;}
.sub-card .sub-name{font-size:14px;font-weight:600;color:var(--text);}
.sub-card .sub-price{font-size:13px;color:var(--text-dim);margin-top:2px;}
.sub-card .sub-note{font-size:11px;color:var(--text-muted);margin-top:2px;}
.sub-card .sub-tag{font-size:11px;font-weight:600;color:var(--cyan);background:rgba(6,182,212,0.15);padding:3px 10px;border-radius:12px;}
.sub-card .sub-save{font-size:11px;font-weight:600;color:var(--green);background:rgba(16,185,129,0.15);padding:3px 10px;border-radius:12px;}
.perk-list{display:flex;flex-direction:column;gap:10px;margin:16px 0;}
.perk-item{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-dim);}
.perk-item .perk-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.badge-wall{display:flex;justify-content:center;gap:16px;margin:20px 0;}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;}
.badge .badge-icon{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;}
.badge.unlocked .badge-icon{background:linear-gradient(135deg,var(--purple),var(--cyan));box-shadow:0 4px 16px rgba(124,58,237,0.4);}
.badge.locked .badge-icon{background:rgba(255,255,255,0.06);opacity:.4;}
.badge .badge-name{font-size:11px;color:var(--text-dim);text-align:center;}
.badge.locked .badge-name{color:var(--text-muted);}
.plan-card{background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:16px;margin:16px 0;}
.plan-card .plan-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.plan-card .plan-label{font-size:13px;font-weight:600;color:var(--purple-light);}
.plan-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;}
.plan-row .plan-k{color:var(--text-dim);}
.plan-row .plan-v{color:var(--text);font-weight:500;}
.congrats-icon{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--cyan));display:flex;align-items:center;justify-content:center;font-size:40px;margin:20px auto 16px;box-shadow:0 8px 32px rgba(124,58,237,0.4);}
.restore-link{display:block;text-align:center;font-size:12px;color:var(--text-muted);margin-top:12px;cursor:pointer;text-decoration:underline;}
.terms-text{text-align:center;font-size:11px;color:var(--text-muted);margin-top:12px;line-height:1.5;}
.terms-text a{color:var(--purple-light);cursor:pointer;}
.tab-bar{position:absolute;bottom:0;left:0;right:0;height:82px;background:rgba(15,12,41,0.95);backdrop-filter:blur(20px);border-top:1px solid var(--card-border);display:flex;align-items:flex-start;padding-top:8px;z-index:80;}
.page.has-tab .page-body{padding-bottom:110px;overflow-y:auto;}
/* For scrollable pages with tab bar, ensure enough bottom padding */
.page.has-tab .page-body{min-height:0;}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:.2s;padding:4px 0;}
.tab-item .tab-icon{font-size:22px;opacity:.5;transition:.2s;}
.tab-item.active .tab-icon{opacity:1;}
.tab-item .tab-label{font-size:10px;color:var(--text-muted);transition:.2s;}
.tab-item.active .tab-label{color:var(--purple-light);}
.course-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;}
.course-card{background:var(--card);border:1px solid var(--card-border);border-radius:14px;overflow:hidden;cursor:pointer;transition:.25s;}
.course-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,0.3);}
.course-card .course-cover{height:100px;background:linear-gradient(135deg,rgba(124,58,237,0.3),rgba(6,182,212,0.2));display:flex;align-items:center;justify-content:center;font-size:32px;}
.course-card .course-info{padding:10px 12px;}
.course-card .course-name{font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px;line-height:1.3;}
.course-card .course-meta{font-size:11px;color:var(--text-muted);}
.cat-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:4px;-webkit-overflow-scrolling:touch;}
.cat-tabs::-webkit-scrollbar{display:none;}
.cat-tab{padding:7px 16px;border-radius:20px;font-size:13px;white-space:nowrap;cursor:pointer;transition:.25s;background:var(--card);border:1px solid var(--card-border);color:var(--text-dim);}
.cat-tab.active{background:var(--purple);border-color:var(--purple);color:#fff;}
.player-area{flex:1;background:#000;display:flex;align-items:center;justify-content:center;position:relative;min-height:0;}
.play-btn{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,0.15);border:2px solid rgba(255,255,255,0.3);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.3s;backdrop-filter:blur(10px);z-index:20;}
.play-btn:hover{background:rgba(255,255,255,0.25);transform:scale(1.05);}
.play-btn .play-icon{width:28px;height:28px;}
.player-progress{padding:12px 20px 8px;}
.progress-track{height:3px;background:rgba(255,255,255,0.15);border-radius:2px;overflow:hidden;}
.progress-bar-fill{height:100%;width:35%;background:linear-gradient(90deg,var(--purple),var(--cyan));border-radius:2px;}
.player-time{display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);margin-top:4px;}
.player-info{padding:8px 20px 16px;text-align:center;}
.player-info .pi-title{font-size:14px;font-weight:600;color:var(--text);}
.player-info .pi-move{font-size:12px;color:var(--text-dim);margin-top:4px;}
.player-controls{display:flex;align-items:center;justify-content:center;gap:24px;padding:12px 20px 40px;}
.ctrl-btn{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.25s;}
.ctrl-btn:hover{background:rgba(255,255,255,0.15);}
.nav-header{display:flex;align-items:center;padding:50px 20px 12px;gap:12px;}
.nav-back{width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--card-border);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s;flex-shrink:0;}
.nav-back:hover{background:rgba(255,255,255,0.12);}
.nav-header .nav-title{font-size:18px;font-weight:600;color:var(--text);flex:1;}
.profile-header{display:flex;align-items:center;gap:14px;margin-bottom:20px;padding-top:4px;}
.profile-avatar{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--cyan));display:flex;align-items:center;justify-content:center;font-size:24px;}
.profile-name{font-size:18px;font-weight:600;color:var(--text);}
.profile-sub{font-size:13px;color:var(--text-dim);margin-top:2px;}
.stat-cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px;}
.stat-card{background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:14px 10px;text-align:center;}
.stat-card .sc-num{font-size:22px;font-weight:700;color:var(--text);}
.stat-card .sc-label{font-size:11px;color:var(--text-dim);margin-top:4px;}
.member-card{background:linear-gradient(135deg,rgba(124,58,237,0.3),rgba(147,51,234,0.15));border:1px solid rgba(124,58,237,0.3);border-radius:16px;padding:18px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;}
.member-card .mc-info .mc-title{font-size:15px;font-weight:600;color:var(--text);}
.member-card .mc-info .mc-desc{font-size:12px;color:var(--text-dim);margin-top:4px;}
.member-card .mc-btn{padding:8px 18px;border-radius:20px;background:var(--purple);border:none;color:#fff;font-size:13px;font-weight:600;cursor:pointer;}
.menu-group{margin-bottom:16px;}
.menu-group .mg-title{font-size:12px;color:var(--text-muted);margin-bottom:8px;padding-left:4px;text-transform:uppercase;letter-spacing:.5px;}
.menu-item{display:flex;align-items:center;padding:14px 16px;background:var(--card);border:1px solid var(--card-border);border-radius:12px;margin-bottom:6px;cursor:pointer;transition:.2s;}
.menu-item:hover{background:rgba(255,255,255,0.1);}
.menu-item .mi-icon{font-size:18px;margin-right:12px;flex-shrink:0;}
.menu-item .mi-text{flex:1;font-size:14px;color:var(--text);}
.menu-item .mi-right{display:flex;align-items:center;gap:8px;}
.menu-item .mi-val{font-size:13px;color:var(--text-dim);}
.menu-item .mi-arrow{color:var(--text-muted);font-size:14px;}
.toggle{width:44px;height:26px;border-radius:13px;background:rgba(255,255,255,0.15);position:relative;cursor:pointer;transition:.3s;flex-shrink:0;}
.toggle.on{background:var(--purple);}
.toggle::after{content:'';position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.3s;}
.toggle.on::after{left:20px;}
.sub-status-card{background:var(--card);border:1px solid var(--card-border);border-radius:16px;padding:20px;margin-bottom:16px;}
.sub-status-card .ssc-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--card-border);}
.sub-status-card .ssc-row:last-child{border-bottom:none;}
.sub-status-card .ssc-k{font-size:13px;color:var(--text-dim);}
.sub-status-card .ssc-v{font-size:13px;color:var(--text);font-weight:500;}
.priv-list{margin:16px 0;}
.priv-item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--card-border);}
.priv-item:last-child{border-bottom:none;}
.priv-item .priv-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.priv-item .priv-text{font-size:13px;color:var(--text);}
.history-item{display:flex;align-items:center;padding:14px 0;border-bottom:1px solid var(--card-border);}
.history-item:last-child{border-bottom:none;}
.history-item .hi-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;margin-right:12px;}
.history-item .hi-info{flex:1;}
.history-item .hi-name{font-size:14px;font-weight:500;color:var(--text);}
.history-item .hi-time{font-size:11px;color:var(--text-muted);margin-top:2px;}
.history-item .hi-status{font-size:12px;color:var(--green);font-weight:500;}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(0,0,0,0.85);color:#fff;padding:12px 24px;border-radius:12px;font-size:13px;opacity:0;transition:.3s;z-index:200;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
@media(min-width:800px){.desk-nav{position:fixed;left:0;top:0;bottom:0;width:200px;background:rgba(15,12,41,0.95);border-right:1px solid var(--card-border);overflow-y:auto;padding:16px 0;z-index:200;}.desk-nav .dn-title{font-size:11px;color:var(--text-muted);padding:8px 16px;text-transform:uppercase;letter-spacing:.5px;}.desk-nav .dn-item{padding:8px 16px;font-size:12px;color:var(--text-dim);cursor:pointer;transition:.2s;border-left:3px solid transparent;}.desk-nav .dn-item:hover{background:rgba(255,255,255,0.05);}.desk-nav .dn-item.active{color:var(--purple-light);border-left-color:var(--purple);background:rgba(124,58,237,0.1);}.desk-nav .dn-item.ob{padding-left:28px;font-size:11px;}}
@media(max-width:799px){.desk-nav{display:none !important;}}
.hero-section{text-align:center;padding-top:60px;display:flex;flex-direction:column;height:100%;}
.hero-logo{font-size:32px;font-weight:800;background:linear-gradient(135deg,#fff,var(--purple-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:12px;}
.hero-subtitle{font-size:16px;color:var(--text-dim);margin-bottom:6px;}
.hero-features{display:flex;gap:12px;justify-content:center;margin:24px 0;}
.hero-feat{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-dim);background:var(--card);padding:8px 14px;border-radius:20px;border:1px solid var(--card-border);}
.hero-feat .hf-icon{font-size:16px;}
.detail-cover{height:200px;background:linear-gradient(135deg,rgba(124,58,237,0.4),rgba(6,182,212,0.2));border-radius:0 0 24px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 -20px;padding:0 20px;width:calc(100% + 40px);flex-shrink:0;}
.detail-play{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,0.2);border:2px solid rgba(255,255,255,0.3);display:flex;align-items:center;justify-content:center;cursor:pointer;margin-bottom:8px;backdrop-filter:blur(10px);}
.detail-cover .dc-duration{font-size:12px;color:var(--text-dim);}
.detail-meta{display:flex;gap:16px;margin:16px 0;}
.detail-meta .dm-item{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--text-dim);}
.detail-meta .dm-item .dm-icon{font-size:14px;}
.detail-goals{margin:16px 0;}
.detail-goals .dg-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:8px;}
.detail-goals .dg-list{list-style:none;}
.detail-goals .dg-list li{font-size:13px;color:var(--text-dim);padding:6px 0;padding-left:16px;position:relative;}
.detail-goals .dg-list li::before{content:'•';position:absolute;left:0;color:var(--purple-light);}
.reminder-time-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--card-border);}
